<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Encuestas con Voz</title>
<style>
  :root{
    --bg:#f4f6f9;
    --panel:#ffffff;
    --text:#1c2430;
    --muted:#6c7684;
    --line:#e6e9ef;
    --primary:#4f46e5;
    --primary-2:#4338ca;
    --danger:#c62828;
    --shadow:0 12px 30px rgba(22,34,51,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
  button,input,textarea,select{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh}
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800}
  .brand-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;display:grid;place-items:center;font-size:19px}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav button,.ghost{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:12px}
  .nav button.active{background:var(--text);color:#fff;border-color:var(--text)}
  main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
  .hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}
  .hero h1{margin:0 0 6px;font-size:clamp(28px,4vw,44px);line-height:1.05}
  .hero p{margin:0;color:var(--muted);max-width:700px}
  .btn{border:0;border-radius:13px;padding:11px 16px;background:var(--primary);color:white;font-weight:700;box-shadow:0 8px 20px rgba(79,70,229,.18)}
  .btn:hover{background:var(--primary-2)}
  .btn.secondary{background:#111827}
  .btn.soft{background:#eef2ff;color:#3730a3;box-shadow:none}
  .btn.danger{background:#fee2e2;color:#991b1b;box-shadow:none}
  .grid{display:grid;gap:16px}
  .grid.cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 8px}
  .card p{margin:0;color:var(--muted)}
  .stat{font-size:30px;font-weight:800;margin-top:8px}
  .survey-card{position:relative;overflow:hidden}
  .survey-strip{position:absolute;left:0;right:0;top:0;height:6px;background:var(--accent,var(--primary))}
  .survey-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{font-size:12px;padding:5px 9px;border-radius:999px;background:#f2f4f7;color:#4b5563}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .section-title{margin:26px 0 12px;font-size:20px}
  .form{display:grid;gap:16px}
  .field{display:grid;gap:7px}
  .field label{font-weight:700}
  .field small{color:var(--muted)}
  input[type="text"],input[type="email"],input[type="tel"],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--text);outline:none
  }
  input:focus,textarea:focus,select:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px #eef2ff}
  textarea{min-height:105px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .radio-row{display:flex;gap:10px;flex-wrap:wrap}
  .option-pill{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
  .option-pill input{margin-right:6px}
  .preview-wrap{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:white;box-shadow:var(--shadow)}
  .preview-banner{height:165px;background:linear-gradient(135deg,var(--accent,var(--primary)),#c4b5fd);background-size:cover;background-position:center}
  .preview-body{padding:24px;background:var(--survey-bg,#ffffff)}
  .preview-body h2{margin:0 0 8px}
  .q-list{display:grid;gap:12px;margin-top:18px}
  .q-item{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px}
  .q-head{display:flex;gap:10px;align-items:flex-start}
  .q-num{min-width:26px;height:26px;border-radius:8px;background:#f3f4f6;display:grid;place-items:center;font-weight:800;font-size:12px}
  .q-content{flex:1}
  .q-content strong{display:block;margin-bottom:4px}
  .q-content span{color:var(--muted);font-size:13px}
  .q-actions{display:flex;gap:6px}
  .icon-btn{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px}
  .wizard{max-width:760px;margin:0 auto}
  .progress{height:8px;background:#eceff3;border-radius:999px;overflow:hidden;margin:14px 0 24px}
  .progress > div{height:100%;background:var(--primary);transition:.25s}
  .question-screen{background:white;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
  .question-screen h2{font-size:clamp(24px,4vw,34px);margin:8px 0 18px}
  .answer-area{min-height:110px}
  .mic{width:74px;height:74px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:28px;display:grid;place-items:center;margin:18px auto 8px;box-shadow:0 12px 30px rgba(79,70,229,.24)}
  .mic.listening{animation:pulse 1.3s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,70,229,.35)}70%{box-shadow:0 0 0 18px rgba(79,70,229,0)}100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}}
  .mic-note{text-align:center;color:var(--muted);font-size:13px}
  .footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
  .review-grid{display:grid;gap:12px}
  .review-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .review-item label{font-weight:800;display:block;margin-bottom:7px}
  .empty{text-align:center;padding:50px 18px;color:var(--muted)}
  .notice{padding:12px 14px;border-radius:12px;background:#eef6ff;color:#214c7c;border:1px solid #dbeafe}
  .success{padding:12px 14px;border-radius:12px;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
  .warning{padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
  .hide{display:none!important}
  .banner-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .color-input{width:54px;height:42px;border:1px solid var(--line);padding:3px;border-radius:10px;background:#fff}
  .mini{font-size:12px;color:var(--muted)}
  @media(max-width:720px){
    .topbar{align-items:flex-start;gap:10px;flex-direction:column}
    .row{grid-template-columns:1fr}
    .hero{align-items:flex-start;flex-direction:column}
    .question-screen{padding:20px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-badge">🎙️</div><span>Encuestas con Voz</span></div>
    <nav class="nav">
      <button data-view="home" class="active">Inicio</button>
      <button data-view="create">Crear encuesta</button>
      <button data-view="surveys">Mis encuestas</button>
      <button data-view="responses">Respuestas</button>
    </nav>
  </header>

  <main id="app"></main>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const state = {
  view:'home',
  editingId:null,
  currentSurvey:null,
  runIndex:0,
  answers:[],
  recognition:null,
  tempBanner:null
};

const store = {
  get surveys(){ return JSON.parse(localStorage.getItem('ev_surveys') || '[]') },
  set surveys(v){ localStorage.setItem('ev_surveys', JSON.stringify(v)) },
  get responses(){ return JSON.parse(localStorage.getItem('ev_responses') || '[]') },
  set responses(v){ localStorage.setItem('ev_responses', JSON.stringify(v)) }
};

function escapeHtml(str=''){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function setView(v){
  state.view=v;
  state.editingId=null;
  $$('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

$$('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));

function render(){
  const root=$('#app');
  if(state.view==='home') root.innerHTML=homeView();
  if(state.view==='create') { root.innerHTML=createView(); bindCreate(); }
  if(state.view==='surveys') { root.innerHTML=surveysView(); bindSurveys(); }
  if(state.view==='responses') root.innerHTML=responsesView();
  if(state.view==='run') { root.innerHTML=runView(); bindRun(); }
  if(state.view==='review') { root.innerHTML=reviewView(); bindReview(); }
  if(state.view==='done') root.innerHTML=doneView();
}

function homeView(){
  const s=store.surveys, r=store.responses;
  return `
  <section class="hero">
    <div>
      <h1>Crea encuestas que se responden hablando.</h1>
      <p>Diseña, personaliza y prueba encuestas de voz sin conectar servicios externos. En esta versión todo se guarda localmente en este navegador.</p>
    </div>
    <button class="btn" onclick="setView('create')">Crear encuesta</button>
  </section>
  <div class="notice">Prototipo local: todavía no usa Google Sheets ni cuentas. El micrófono se solicita únicamente cuando una persona decide responder por voz.</div>
  <h2 class="section-title">Resumen</h2>
  <div class="grid cards">
    <div class="card"><p>Encuestas creadas</p><div class="stat">${s.length}</div></div>
    <div class="card"><p>Respuestas guardadas</p><div class="stat">${r.length}</div></div>
    <div class="card"><p>Almacenamiento</p><div class="stat" style="font-size:21px">Este dispositivo</div><p>localStorage</p></div>
  </div>
  <h2 class="section-title">Cómo funciona</h2>
  <div class="grid cards">
    <div class="card"><h3>1. Describe</h3><p>Escribe el objetivo de la encuesta y elige si será corta o larga.</p></div>
    <div class="card"><h3>2. Ajusta</h3><p>Edita preguntas, cambia colores y agrega un banner.</p></div>
    <div class="card"><h3>3. Responde</h3><p>La persona ve cada pregunta y responde por voz o escribiendo.</p></div>
    <div class="card"><h3>4. Revisa</h3><p>Al final se ve la encuesta diligenciada, no una transcripción continua.</p></div>
  </div>`;
}

function defaultQuestions(desc, length){
  const d=(desc||'').toLowerCase();
  const qs=[];
  if(/evento|congreso|encuentro|iglesia|asistente/.test(d)){
    qs.push(
      {text:'¿Cuál es tu nombre completo?',type:'text',required:true},
      {text:'¿De qué ciudad o municipio vienes?',type:'text',required:true},
      {text:'¿Es la primera vez que participas en este evento?',type:'yesno',required:true},
      {text:'¿Cómo te enteraste de este evento?',type:'text',required:true},
      {text:'¿Qué esperas encontrar o aprender aquí?',type:'long',required:false}
    );
    if(length==='long') qs.push(
      {text:'¿Qué tema te interesa especialmente?',type:'long',required:false},
      {text:'¿Qué podríamos hacer para mejorar tu experiencia?',type:'long',required:false},
      {text:'¿Te gustaría recibir información de próximos eventos?',type:'yesno',required:true}
    );
  }else if(/cliente|servicio|satisfacción|satisfaccion|producto/.test(d)){
    qs.push(
      {text:'¿Cuál es tu nombre?',type:'text',required:false},
      {text:'¿Cómo calificarías tu experiencia general?',type:'scale',required:true},
      {text:'¿Qué fue lo que más te gustó?',type:'long',required:false},
      {text:'¿Qué podríamos mejorar?',type:'long',required:false}
    );
    if(length==='long') qs.push(
      {text:'¿Qué tan fácil fue usar nuestro servicio?',type:'scale',required:true},
      {text:'¿Recomendarías este servicio a otra persona?',type:'yesno',required:true},
      {text:'¿Hay algo más que quieras contarnos?',type:'long',required:false}
    );
  }else{
    qs.push(
      {text:'¿Cuál es tu nombre?',type:'text',required:false},
      {text:'¿Cuál es tu opinión principal sobre este tema?',type:'long',required:true},
      {text:'¿Qué aspecto consideras más importante?',type:'long',required:true},
      {text:'¿Qué mejorarías?',type:'long',required:false}
    );
    if(length==='long') qs.push(
      {text:'¿Qué experiencia previa tienes relacionada con este tema?',type:'long',required:false},
      {text:'¿Qué resultado te gustaría obtener?',type:'long',required:false},
      {text:'¿Quieres agregar algún comentario final?',type:'long',required:false}
    );
  }
  return qs;
}

function createView(){
  const editing=state.editingId ? store.surveys.find(s=>s.id===state.editingId) : null;
  const s=editing || {title:'',description:'',prompt:'',length:'short',accent:'#4f46e5',bg:'#ffffff',banner:'',questions:[]};
  return `
  <section class="hero">
    <div><h1>${editing?'Editar encuesta':'Crear encuesta'}</h1><p>Empieza por describir lo que quieres preguntar. Puedes generar una base y luego modificarla.</p></div>
  </section>
  <div class="grid" style="grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);align-items:start">
    <section class="card">
      <div class="form">
        <div class="field">
          <label>Nombre de la encuesta</label>
          <input id="title" type="text" placeholder="Ej. Encuesta asistentes Iglecrecimiento" value="${escapeHtml(s.title)}">
        </div>
        <div class="field">
          <label>Descripción para la persona que responde</label>
          <textarea id="description" placeholder="Ej. Queremos conocerte mejor. Tus respuestas nos ayudan a mejorar.">${escapeHtml(s.description)}</textarea>
        </div>
        <div class="field">
          <label>Describe qué encuesta quieres crear</label>
          <textarea id="prompt" placeholder="Ej. Quiero conocer a las personas nuevas que llegan a un evento, saber de dónde vienen, cómo se enteraron y qué esperan del evento.">${escapeHtml(s.prompt)}</textarea>
          <small>En este prototipo la generación es local y usa plantillas inteligentes sencillas; luego se puede conectar a IA real.</small>
        </div>
        <div class="field">
          <label>Longitud</label>
          <div class="radio-row">
            <label class="option-pill"><input type="radio" name="length" value="short" ${s.length==='short'?'checked':''}> Corta</label>
            <label class="option-pill"><input type="radio" name="length" value="long" ${s.length==='long'?'checked':''}> Larga</label>
          </div>
        </div>
        <div class="actions">
          <button class="btn soft" id="generate">Generar preguntas</button>
          <button class="ghost" id="addQuestion">+ Agregar pregunta</button>
        </div>
        <div id="questionsEditor" class="q-list"></div>
      </div>
    </section>

    <aside class="card">
      <h3>Personalización</h3>
      <div class="form" style="margin-top:14px">
        <div class="row">
          <div class="field"><label>Color principal</label><input id="accent" class="color-input" type="color" value="${s.accent}"></div>
          <div class="field"><label>Fondo</label><input id="bg" class="color-input" type="color" value="${s.bg}"></div>
        </div>
        <div class="field">
          <label>Banner</label>
          <div class="banner-upload">
            <input id="banner" type="file" accept="image/*">
            ${s.banner?'<span class="mini">Banner guardado</span>':''}
          </div>
          <small>La imagen se guarda dentro del navegador para este prototipo.</small>
        </div>
        <button class="btn secondary" id="saveSurvey">Guardar encuesta</button>
      </div>
      <div id="miniPreview" style="margin-top:18px"></div>
    </aside>
  </div>`;
}

let editingQuestions=[];

function bindCreate(){
  const existing=state.editingId ? store.surveys.find(s=>s.id===state.editingId) : null;
  editingQuestions=(existing?.questions || []).map(q=>({...q}));
  state.tempBanner=existing?.banner || '';
  renderQuestionsEditor();
  updateMiniPreview();

  $('#generate').onclick=()=>{
    const prompt=$('#prompt').value.trim();
    const length=$('input[name="length"]:checked').value;
    editingQuestions=defaultQuestions(prompt,length);
    renderQuestionsEditor();
    updateMiniPreview();
  };
  $('#addQuestion').onclick=()=>{
    editingQuestions.push({text:'Nueva pregunta',type:'text',required:false});
    renderQuestionsEditor();
  };
  $('#accent').oninput=updateMiniPreview;
  $('#bg').oninput=updateMiniPreview;
  $('#title').oninput=updateMiniPreview;
  $('#description').oninput=updateMiniPreview;
  $('#banner').onchange=async(e)=>{
    const f=e.target.files?.[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{state.tempBanner=reader.result;updateMiniPreview()};
    reader.readAsDataURL(f);
  };
  $('#saveSurvey').onclick=saveSurvey;
}

function renderQuestionsEditor(){
  const box=$('#questionsEditor');
  if(!box) return;
  if(!editingQuestions.length){
    box.innerHTML='<div class="empty">Todavía no hay preguntas. Describe la encuesta y pulsa “Generar preguntas”.</div>';
    return;
  }
  box.innerHTML=editingQuestions.map((q,i)=>`
    <div class="q-item">
      <div class="q-head">
        <div class="q-num">${i+1}</div>
        <div class="q-content">
          <input type="text" value="${escapeHtml(q.text)}" data-qtext="${i}">
          <div class="row" style="margin-top:8px">
            <select data-qtype="${i}">
              <option value="text" ${q.type==='text'?'selected':''}>Respuesta corta</option>
              <option value="long" ${q.type==='long'?'selected':''}>Respuesta larga</option>
              <option value="yesno" ${q.type==='yesno'?'selected':''}>Sí / No</option>
              <option value="scale" ${q.type==='scale'?'selected':''}>Escala 1 a 5</option>
            </select>
            <label class="option-pill"><input type="checkbox" data-qreq="${i}" ${q.required?'checked':''}> Obligatoria</label>
          </div>
        </div>
        <div class="q-actions"><button class="icon-btn" data-del="${i}">✕</button></div>
      </div>
    </div>`).join('');

  $$('[data-qtext]').forEach(el=>el.oninput=()=>editingQuestions[+el.dataset.qtext].text=el.value);
  $$('[data-qtype]').forEach(el=>el.onchange=()=>editingQuestions[+el.dataset.qtype].type=el.value);
  $$('[data-qreq]').forEach(el=>el.onchange=()=>editingQuestions[+el.dataset.qreq].required=el.checked);
  $$('[data-del]').forEach(el=>el.onclick=()=>{editingQuestions.splice(+el.dataset.del,1);renderQuestionsEditor();updateMiniPreview();});
}

function updateMiniPreview(){
  const p=$('#miniPreview'); if(!p) return;
  const accent=$('#accent')?.value || '#4f46e5';
  const bg=$('#bg')?.value || '#fff';
  const title=$('#title')?.value || 'Título de la encuesta';
  const desc=$('#description')?.value || 'Descripción de la encuesta';
  const banner=state.tempBanner;
  p.innerHTML=`
    <div class="preview-wrap" style="--accent:${accent};--survey-bg:${bg}">
      <div class="preview-banner" style="${banner?`background-image:url('${banner}')`:''}"></div>
      <div class="preview-body">
        <h2>${escapeHtml(title)}</h2>
        <p>${escapeHtml(desc)}</p>
        <div class="chip" style="display:inline-block;margin-top:10px">${editingQuestions.length} preguntas</div>
      </div>
    </div>`;
}

function saveSurvey(){
  const title=$('#title').value.trim();
  if(!title){alert('Escribe un nombre para la encuesta.');return}
  if(!editingQuestions.length){alert('Agrega al menos una pregunta.');return}
  const surveys=store.surveys;
  const item={
    id:state.editingId || 's_'+Date.now(),
    title,
    description:$('#description').value.trim(),
    prompt:$('#prompt').value.trim(),
    length:$('input[name="length"]:checked').value,
    accent:$('#accent').value,
    bg:$('#bg').value,
    banner:state.tempBanner || '',
    questions:editingQuestions,
    updatedAt:new Date().toISOString()
  };
  const idx=surveys.findIndex(s=>s.id===item.id);
  if(idx>=0) surveys[idx]=item; else surveys.unshift(item);
  store.surveys=surveys;
  state.editingId=null;
  state.view='surveys';
  $$('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.view==='surveys'));
  render();
}

function surveysView(){
  const surveys=store.surveys;
  return `
  <section class="hero">
    <div><h1>Mis encuestas</h1><p>Administra y prueba las encuestas guardadas en este navegador.</p></div>
    <button class="btn" onclick="setView('create')">Nueva encuesta</button>
  </section>
  ${surveys.length?`<div class="grid cards">${surveys.map(s=>`
    <article class="card survey-card" style="--accent:${s.accent}">
      <div class="survey-strip"></div>
      <h3>${escapeHtml(s.title)}</h3>
      <p>${escapeHtml(s.description || 'Sin descripción')}</p>
      <div class="survey-meta">
        <span class="chip">${s.questions.length} preguntas</span>
        <span class="chip">${s.length==='short'?'Corta':'Larga'}</span>
        <span class="chip">${store.responses.filter(r=>r.surveyId===s.id).length} respuestas</span>
      </div>
      <div class="actions">
        <button class="btn" data-run="${s.id}">Responder</button>
        <button class="ghost" data-edit="${s.id}">Editar</button>
        <button class="ghost" data-copy="${s.id}">Duplicar</button>
        <button class="btn danger" data-delete="${s.id}">Eliminar</button>
      </div>
    </article>`).join('')}</div>`:`<div class="empty card">Aún no has creado encuestas.</div>`}`;
}

function bindSurveys(){
  $$('[data-run]').forEach(b=>b.onclick=()=>startSurvey(b.dataset.run));
  $$('[data-edit]').forEach(b=>b.onclick=()=>{
    state.editingId=b.dataset.edit; state.view='create';
    $$('.nav button').forEach(x=>x.classList.toggle('active', x.dataset.view==='create'));
    render();
  });
  $$('[data-copy]').forEach(b=>b.onclick=()=>{
    const surveys=store.surveys;
    const original=surveys.find(s=>s.id===b.dataset.copy);
    const copy=JSON.parse(JSON.stringify(original));
    copy.id='s_'+Date.now(); copy.title+=' (copia)'; copy.updatedAt=new Date().toISOString();
    surveys.unshift(copy); store.surveys=surveys; render();
  });
  $$('[data-delete]').forEach(b=>b.onclick=()=>{
    if(!confirm('¿Eliminar esta encuesta?')) return;
    store.surveys=store.surveys.filter(s=>s.id!==b.dataset.delete);
    render();
  });
}

function startSurvey(id){
  const s=store.surveys.find(x=>x.id===id);
  if(!s) return;
  state.currentSurvey=s;
  state.runIndex=0;
  state.answers=s.questions.map(()=> '');
  state.view='run';
  render();
}

function answerControl(q,val,i){
  if(q.type==='yesno') return `
    <div class="radio-row">
      <label class="option-pill"><input type="radio" name="ans${i}" value="Sí" ${val==='Sí'?'checked':''}> Sí</label>
      <label class="option-pill"><input type="radio" name="ans${i}" value="No" ${val==='No'?'checked':''}> No</label>
    </div>`;
  if(q.type==='scale') return `
    <div class="radio-row">${[1,2,3,4,5].map(n=>`<label class="option-pill"><input type="radio" name="ans${i}" value="${n}" ${String(val)===String(n)?'checked':''}> ${n}</label>`).join('')}</div>`;
  if(q.type==='long') return `<textarea id="answerInput" class="answer-area" placeholder="Puedes hablar o escribir aquí.">${escapeHtml(val)}</textarea>`;
  return `<input id="answerInput" type="text" value="${escapeHtml(val)}" placeholder="Puedes hablar o escribir aquí.">`;
}

function runView(){
  const s=state.currentSurvey, i=state.runIndex, q=s.questions[i], val=state.answers[i] || '';
  const progress=((i)/s.questions.length)*100;
  return `
  <div class="wizard" style="--primary:${s.accent}">
    <div class="preview-wrap" style="--accent:${s.accent};--survey-bg:${s.bg}">
      ${i===0?`<div class="preview-banner" style="${s.banner?`background-image:url('${s.banner}')`:''}"></div>`:''}
      <div class="preview-body">
        <div class="chip">${escapeHtml(s.title)}</div>
        <div class="progress"><div style="width:${progress}%"></div></div>
        <section class="question-screen">
          <div class="mini">Pregunta ${i+1} de ${s.questions.length}${q.required?' · obligatoria':''}</div>
          <h2>${escapeHtml(q.text)}</h2>
          ${answerControl(q,val,i)}
          ${(q.type==='text'||q.type==='long')?`
            <button class="mic" id="micBtn" title="Responder por voz">🎙️</button>
            <div class="mic-note" id="micNote">Toca el micrófono si quieres responder hablando. La página no leerá la pregunta.</div>`:''}
          <div class="footer-actions">
            <button class="ghost" id="prevBtn" ${i===0?'disabled':''}>Anterior</button>
            <button class="btn" id="nextBtn">${i===s.questions.length-1?'Revisar respuestas':'Siguiente'}</button>
          </div>
        </section>
      </div>
    </div>
  </div>`;
}

function bindRun(){
  const s=state.currentSurvey, i=state.runIndex, q=s.questions[i];

  if(q.type==='yesno'||q.type==='scale'){
    $$(`input[name="ans${i}"]`).forEach(el=>el.onchange=()=>state.answers[i]=el.value);
  }else{
    const input=$('#answerInput');
    input.oninput=()=>state.answers[i]=input.value;
    const mb=$('#micBtn');
    if(mb) mb.onclick=()=>startVoice(input,mb,$('#micNote'));
  }

  $('#prevBtn').onclick=()=>{saveCurrent(); if(state.runIndex>0){state.runIndex--;render();}};
  $('#nextBtn').onclick=()=>{
    saveCurrent();
    if(q.required && !String(state.answers[i]||'').trim()){
      alert('Esta pregunta es obligatoria.');return;
    }
    stopRecognition();
    if(state.runIndex<s.questions.length-1){state.runIndex++;render();}
    else{state.view='review';render();}
  };
}

function saveCurrent(){
  const i=state.runIndex,q=state.currentSurvey.questions[i];
  if(q.type==='yesno'||q.type==='scale'){
    const checked=$(`input[name="ans${i}"]:checked`);
    if(checked) state.answers[i]=checked.value;
  }else{
    const input=$('#answerInput'); if(input) state.answers[i]=input.value;
  }
}

function startVoice(input,btn,note){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    note.textContent='Este navegador no ofrece reconocimiento de voz aquí. Puedes escribir la respuesta.';
    return;
  }
  stopRecognition();
  const rec=new SR();
  state.recognition=rec;
  rec.lang='es-CO';
  rec.interimResults=false;
  rec.continuous=false;
  rec.maxAlternatives=1;
  btn.classList.add('listening');
  note.textContent='Escuchando… habla con normalidad.';
  rec.onresult=e=>{
    const t=e.results[0][0].transcript;
    input.value=(input.value?input.value+' ':'')+t;
    input.dispatchEvent(new Event('input'));
  };
  rec.onerror=e=>{
    note.textContent=e.error==='not-allowed'?'No se concedió permiso de micrófono. Puedes escribir la respuesta.':'No pude escuchar bien. Puedes intentar de nuevo o escribir.';
  };
  rec.onend=()=>{
    btn.classList.remove('listening');
    note.textContent='Toca el micrófono si quieres agregar o repetir tu respuesta.';
    state.recognition=null;
  };
  rec.start();
}

function stopRecognition(){
  if(state.recognition){try{state.recognition.stop()}catch(e){} state.recognition=null}
}

function reviewView(){
  const s=state.currentSurvey;
  return `
  <div class="wizard">
    <section class="hero"><div><h1>Revisa tus respuestas</h1><p>No mostramos una transcripción continua. Aquí ves la encuesta ya diligenciada y puedes corregir cualquier punto.</p></div></section>
    <div class="review-grid">
      ${s.questions.map((q,i)=>`
        <div class="review-item">
          <label>${i+1}. ${escapeHtml(q.text)}</label>
          ${q.type==='long'?`<textarea data-review="${i}">${escapeHtml(state.answers[i]||'')}</textarea>`:
            `<input type="text" data-review="${i}" value="${escapeHtml(state.answers[i]||'')}">`}
        </div>`).join('')}
    </div>
    <div class="footer-actions">
      <button class="ghost" id="backToSurvey">Volver a la encuesta</button>
      <button class="btn" id="submitSurvey">Guardar respuesta</button>
    </div>
  </div>`;
}

function bindReview(){
  $$('[data-review]').forEach(el=>el.oninput=()=>state.answers[+el.dataset.review]=el.value);
  $('#backToSurvey').onclick=()=>{state.runIndex=state.currentSurvey.questions.length-1;state.view='run';render()};
  $('#submitSurvey').onclick=()=>{
    const responses=store.responses;
    responses.unshift({
      id:'r_'+Date.now(),
      surveyId:state.currentSurvey.id,
      surveyTitle:state.currentSurvey.title,
      createdAt:new Date().toISOString(),
      answers:state.currentSurvey.questions.map((q,i)=>({question:q.text,answer:state.answers[i]||''}))
    });
    store.responses=responses;
    state.view='done';render();
  };
}

function doneView(){
  return `
  <div class="wizard">
    <div class="card" style="text-align:center;padding:44px">
      <div style="font-size:52px">✓</div>
      <h1>Respuesta guardada</h1>
      <p style="color:var(--muted)">En esta prueba quedó guardada únicamente en este navegador.</p>
      <div class="actions" style="justify-content:center;margin-top:20px">
        <button class="btn" onclick="startSurvey('${state.currentSurvey.id}')">Responder otra vez</button>
        <button class="ghost" onclick="setView('home')">Volver al inicio</button>
      </div>
    </div>
  </div>`;
}

function responsesView(){
  const rows=store.responses;
  return `
  <section class="hero">
    <div><h1>Respuestas</h1><p>Registros almacenados localmente en este dispositivo.</p></div>
  </section>
  ${rows.length?rows.map(r=>`
    <article class="card" style="margin-bottom:12px">
      <h3>${escapeHtml(r.surveyTitle)}</h3>
      <p>${new Date(r.createdAt).toLocaleString('es-CO')}</p>
      <div class="q-list">${r.answers.map(a=>`<div class="q-item"><strong>${escapeHtml(a.question)}</strong><div style="margin-top:6px">${escapeHtml(a.answer||'—')}</div></div>`).join('')}</div>
    </article>`).join(''):`<div class="empty card">Todavía no hay respuestas.</div>`}`;
}

render();
</script>
</body>
</html>
